<form class="example-form" [formGroup]="returnForm" (ngSubmit)="returnSubmit()">   
    <div class="form-group">
        <mat-form-field class="example-full-width">
          <mat-label>Select Assesment Year</mat-label>
          <select name="assessmentYear">
            <option value="2022-2023">2022-2023></option>
            <option value="2021-2022">2021-2022</option>
            <option value="2020-2021">2021-2022</option>
          </select>
        </mat-form-field>
      </div> 
      
    <table class="example-full-width" cellspacing="0"><tr>
        <td><div class="form-group">
            <mat-form-field class="example-full-width">
              <mat-label>TIN</mat-label>
              <input
              type="number"
              name="tin"
              formControlName="tin" 
              matInput
              />
            </mat-form-field>
          </div></td><td>
            <div class="form-group">
            <mat-form-field class="example-full-width">
              <mat-label>Gender</mat-label>
              <select name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="freedom fighter">Freedom Fighter</option>
              </select>
            </mat-form-field>
          </div> </td>
      </tr></table>

    <table class="example-full-width" cellspacing="0"><tr>
      <td><div class="form-group">
        <mat-form-field class="example-full-width">
          <mat-label>Salary</mat-label>
          <input
          type="number"
          name="salary"
          formControlName="salary" 
          matInput
          />
        </mat-form-field>
      </div></td>
      <td><div class="form-group">
        <mat-form-field class="example-full-width">
          <mat-label>House Rent</mat-label>
          <input
          type="number"
          name="houserent"
          formControlName="houserent" 
          matInput
          />
        </mat-form-field>
      </div></td>
    </tr></table>

    <table class="example-full-width" cellspacing="0"><tr>
        <td><div class="form-group">
            <mat-form-field class="example-full-width">
              <mat-label>Festival Bonus</mat-label>
              <input
              type="number"
              name="festival"
              formControlName="festivalbonus" 
              matInput
              />
            </mat-form-field>
          </div></td>
        <td><div class="form-group">
            <mat-form-field class="example-full-width">
              <mat-label>Investment</mat-label>
              <input
              type="number"
              name="investment"
              formControlName="investment" 
              matInput
              />
            </mat-form-field>
          </div></td>
      </tr></table>
      <div class="form-group">
        <mat-form-field class="example-full-width">
          <mat-label>Source Tax Deducted</mat-label>
          <input
          type="number"
          name="sourcetax"
          formControlName="sourcetax" 
          matInput
          />
        </mat-form-field>
      </div>

      <div class="btn-container">
         
        <app-button
        [label]="buttonLabel"
        [color]="buttonColor" 
        [type]="buttonType"
        ></app-button><br>
       
      </div>
    
  </form>
