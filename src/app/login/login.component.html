<div class="login-container">
    <div class="logo">NBR LOGIN</div>
    <div class="login-form">
      <form class="example-form" [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="form-group">
          <mat-form-field class="example-full-width">
            <mat-label>Username</mat-label>
            <input
            type="text"
            name="username"
            formControlName="username"
            matInput
            
            />
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field class="example-full-width">
            <mat-label>Password</mat-label>
            <input
            type="password"
            name="password"
            formControlName="password"
            matInput
            
            />
          </mat-form-field>
        </div>
        
        <div class="btn-container">
         
          <app-button
          [label]="buttonLabel"
          [color]="buttonColor" 
          [type]="buttonType"
          [disabled]="loginForm.get('username')?.invalid?true:false"
          (click)="login()"
          ></app-button><br>
          <span *ngIf="loginForm.get('username')?.invalid &&
          loginForm.get('username')?.errors?.['required']" style="color:red">Username is required</span><br>
          <span *ngIf="loginForm.get('username')?.errors?.['minlength']" style="color:red">Username must contain 5 characters</span>
        </div>

      </form>
    </div>
  </div>
